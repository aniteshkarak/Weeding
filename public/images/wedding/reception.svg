<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B35"/><stop offset="50%" stop-color="#171122"/><stop offset="100%" stop-color="#0D0914"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D1"/>
      <stop offset="50%" stop-color="#D4BE8D"/>
      <stop offset="100%" stop-color="#8C713F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#BB8FCE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BB8FCE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="luxDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#BB8FCE" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#luxDots)"/>
  <circle cx="300" cy="315" r="240" fill="url(#glow)"/>

  <!-- Ornate Frame -->
  <rect x="24" y="24" width="552" height="702" rx="8" fill="none" stroke="#BB8FCE" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="34" y="34" width="532" height="682" rx="4" fill="none" stroke="#BB8FCE" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Corner Flourishes -->
  <path d="M 28 48 L 28 28 L 48 28" fill="none" stroke="#BB8FCE" stroke-width="2"/>
  <path d="M 572 48 L 572 28 L 552 28" fill="none" stroke="#BB8FCE" stroke-width="2"/>
  <path d="M 28 702 L 28 722 L 48 722" fill="none" stroke="#BB8FCE" stroke-width="2"/>
  <path d="M 572 702 L 572 722 L 552 722" fill="none" stroke="#BB8FCE" stroke-width="2"/>

  <!-- Central Emblem / Silhouette -->
  <g transform="translate(300, 315) scale(1.2)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#BB8FCE" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="82" fill="#BB8FCE" fill-opacity="0.08"/>
    
      <!-- Chandelier & Glasses motif -->
      <path d="M -20 -35 L 20 -35 L 0 -5 Z" fill="none" stroke="#D4BE8D" stroke-width="2"/>
      <line x1="0" y1="-5" x2="0" y2="25" stroke="#D4BE8D" stroke-width="2"/>
      <line x1="-15" y1="25" x2="15" y2="25" stroke="#D4BE8D" stroke-width="2.5"/>
      <circle cx="-15" cy="-20" r="2" fill="#FFF2D1"/>
      <circle cx="15" cy="-20" r="2" fill="#FFF2D1"/>
      <circle cx="0" cy="-45" r="4" fill="#BB8FCE"/>
    
  </g>

  <!-- Typography -->
  <text x="300" y="555" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="url(#goldText)" letter-spacing="3">GRAND RECEPTION</text>
  <text x="300" y="607.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.75" letter-spacing="4">AN EVENING OF ELEGANCE & CHEERS</text>

  <!-- Decorative bottom bar -->
  <path d="M 240 645 L 360 645" stroke="#BB8FCE" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="300" cy="645" r="3" fill="#BB8FCE"/>
</svg>